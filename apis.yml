- aid: astronomer:astronomer-workspace-api
  name: Astronomer Workspace API
  description: >-
    The `workspace` object represents an Astro Workspace, which is a collection of Deployments that can
    be accessed by a specific group of users. It contains metadata about a Workspace, but does not contain
    objects within the Workspace such as users and Deployments. Make requests to `workspace` endpoints
    to manage high level details about your Workspace. To manage resources within a Workspace, make requests
    to the endpoints related to those resources, such as `users`, and use the `workspaceIds` parameter
    to filter results by Workspace. See [Configure Workspaces](https://astronomer.io/docs/astro/manage-workspaces).
  humanURL: https://www.astronomer.io/docs/astro/api/overview
  baseURL: https://api.astronomer.io/v1
