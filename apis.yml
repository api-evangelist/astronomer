- aid: astronomer:astronomer-user-api
  name: Astronomer User API
  description: >-
    The `user` object represents a user account in your Astro Organization. Astro creates a new `user`
    object whenever you invite a user by email or add a user to Astro through an identity provider. The
    object contains all information about a user, including their personal information, roles, and login
    attempts. It doesn't include attributes for actions that the user completes after they log in, such
    as updating a Deployment. Make requests to `user` endpoints to manage permissions for existing users
    both at the Organization and Workspace level. To create new users, make requests to `invite` endpoints
    instead.
  humanURL: https://www.astronomer.io/docs/astro/api/overview
  baseURL: https://api.astronomer.io/v1
  tags:
  - User
