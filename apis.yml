aid: astronomer
name: Astronomer
description: >-
  Astronomer is the company behind Astro, a fully managed data operations platform
  powered by Apache Airflow. Astro lets data teams author, orchestrate, run, and
  observe data pipelines (DAGs) at scale across a managed control plane and data
  plane. The Astro Platform API is a production-ready REST API for programmatic
  control of Astro resources — Organizations, Workspaces, Deployments, Clusters,
  Users, Teams, role-based access control, API tokens, deploys, and environment
  objects — authenticated with bearer API tokens. Astronomer also ships the Astro
  CLI, an official Terraform provider, the Astro Python SDK, a documentation MCP
  server, and Astro Runtime, its distribution of Apache Airflow.
