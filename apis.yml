- aid: astronomer:astronomer-organization-api
  name: Astronomer Organization API
  description: >-
    The `organization` object contains the metadata and configurations of an Astro Organization. It does
    not include objects within the Organization, such as users and clusters. Make requests to `organization`
    endpoints to view and update high level settings for your Organization, including settings related
    to authentication and billing. To manage resources within an Organization, make requests to the endpoints
    related to those resources, such as `users`. See [Billing](https://astronomer.io/docs/astro/manage-billing),
    [Set up single sign-on](https://astronomer.io/docs/astro/configure-idp), and [Manage domains](https://astronomer.io/docs/astro/manage-domains).
  humanURL: https://www.astronomer.io/docs/astro/api/overview
