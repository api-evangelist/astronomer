openapi: 3.2.0
info:
  title: Astronomer Marketing Site Function Mux Get Playback Id API
  version: 1.0.0
  description: Public function endpoints hosted on www.astronomer.io using Netlify Functions.
servers:
- url: https://www.astronomer.io/.netlify/functions
tags:
- name: Mux Get Playback Id
paths:
  /mux-get-playback-id:
    get:
      summary: Get Mux playback readiness by upload ID
      operationId: getMuxPlaybackId
      parameters:
      - name: uploadId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Playback status
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - processing
                    - ready
                    - error
                  playbackId:
                    type: string
                  message:
                    type: string
                required:
                - status
        '400':
          description: Missing uploadId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded — wait for the window to reset before retrying
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server or upstream API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Mux Get Playback Id
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable description of the error
        code:
          type: string
          description: Machine-readable error code (e.g. METHOD_NOT_ALLOWED, INTERNAL_ERROR, MISSING_PARAM)
        hint:
          type: string
          description: Optional resolution hint for the caller
  headers:
    RateLimit-Remaining:
      description: Requests remaining in the current window
      schema:
        type: integer
    RateLimit-Limit:
      description: Maximum number of requests allowed per window
      schema:
        type: integer
    RateLimit-Reset:
      description: Unix timestamp (seconds) when the current window resets
      schema:
        type: integer
