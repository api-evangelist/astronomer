servers:
- url: https://api.astronomer.io/v1
tags:
- description: The `organization` object contains the metadata and configurations
    of an Astro Organization. It does not include objects within the Organization,
    such as users and clusters. Make requests to `organization` endpoints to view
    and update high level settings for your Organization, including settings related
    to authentication and billing. To manage resources within an Organization, make
    requests to the endpoints related to those resources, such as `users`. See [Billing](https://astronomer.io/docs/astro/manage-billing),
    [Set up single sign-on](https://astronomer.io/docs/astro/configure-idp), and [Manage
    domains](https://astronomer.io/docs/astro/manage-domains).
  name: Organization
- description: The `deployment` object represents an Astro Deployment, which is a
    hosted Airflow environment that is powered by all core Airflow components, including
    schedulers and workers. Make requests to the `deployment` object to create, update,
    or delete a Deployment or its computational resources. See [Deployment settings](https://astronomer.io/docs/astro/deployment-settings).
  name: Deployment
- description: A `cluster` object represents an Astro cluster, which is a Kubernetes
    cluster that hosts the infrastructure required to run Deployments. Make requests
    to `cluster` endpoints to manage your standard and dedicated clusters. See [Create
    a dedicated cluster](https://astronomer.io/docs/astro/create-dedicated-cluster).
  name: Cluster
- description: The `workspace` object represents an Astro Workspace, which is a collection
    of Deployments that can be accessed by a specific group of users. It contains
    metadata about a Workspace, but does not contain objects within the Workspace
    such as users and Deployments. Make requests to `workspace` endpoints to manage
    high level details about your Workspace. To manage resources within a Workspace,
    make requests to the endpoints related to those resources, such as `users`, and
    use the `workspaceIds` parameter to filter results by Workspace. See [Configure
    Workspaces](https://astronomer.io/docs/astro/manage-workspaces).
  name: Workspace
- description: The `user` object represents a user account in your Astro Organization.
    Astro creates a new `user` object whenever you invite a user by email or add a
    user to Astro through an identity provider. The object contains all information
    about a user, including their personal information, roles, and login attempts.
    It doesn't include attributes for actions that the user completes after they log
    in, such as updating a Deployment. Make requests to `user` endpoints to manage
    permissions for existing users both at the Organization and Workspace level. To
    create new users, make requests to `invite` endpoints instead.
  name: User
- description: The `team` object represents an Astro Team, which is a group of users
    that share the same permissions across your Organization and Workspaces. Make
    requests to `team` endpoints to create, update, and delete Teams across an Organization.
    See [Configure Teams on Astro](https://astronomer.io/docs/astro/manage-teams).
  name: Team
- description: The `apitoken` object represents a single API token within your Organization.
    API tokens are used to authenticate automated tools and processes to your Organization.
    They have varying levels of access to your resources based on their Organization,
    Workspace, and Deployment roles. See [Workspace API tokens](workspace-api-tokens.md)
    and [Organization API tokens](organization-api-tokens.md).
  name: ApiToken
